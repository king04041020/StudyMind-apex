name: Publish Kavelynt APK as public release

on:
  workflow_run:
    workflows:
      - Build APK Kavelynt Apex
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v5
        with:
          name: Kavelynt-Apex-APK
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify APK file
        run: |
          set -euo pipefail
          test -s release/app-release.apk
          file release/app-release.apk
          sha256sum release/app-release.apk

      - name: Replace public APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload latest-apk release/app-release.apk --clobber --repo "$GH_REPO"
