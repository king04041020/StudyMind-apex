
name: Extraction StudyMind

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          set -e

          ARCHIVE="StudyMind-Upload.zip.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive introuvable : $ARCHIVE"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/studymind
          unzip -q "$ARCHIVE" -d /tmp/studymind

          PUBSPEC=$(find /tmp/studymind -name pubspec.yaml -type f -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml introuvable"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PUBSPEC")
          cp -a "$SOURCE_DIR"/. .

          rm -f "$ARCHIVE"

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Enregistrer dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extraction du projet StudyMind"
            git push
          fi
          
