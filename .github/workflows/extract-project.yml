
name: Extraction automatique de StudyMind

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extraire le projet Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier et extraire le ZIP
        run: |
          set -euo pipefail

          ARCHIVE="StudyMind-Upload.zip.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERREUR : archive introuvable : $ARCHIVE"
            exit 1
          fi

          mkdir -p /tmp/studymind
          unzip -q "$ARCHIVE" -d /tmp/studymind

          PUBSPEC=$(find /tmp/studymind -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERREUR : pubspec.yaml introuvable dans le ZIP"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PUBSPEC")

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ARCHIVE"

      - name: Enregistrer les fichiers dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extraction du projet StudyMind"
            git push
          else
            echo "Aucun changement à enregistrer"
          fi
          
