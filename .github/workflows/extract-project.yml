name: Vérification StudyMind

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Vérifier le projet Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier la structure Flutter
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "ERREUR : pubspec.yaml introuvable"; exit 1; }
          test -f lib/main.dart || { echo "ERREUR : lib/main.dart introuvable"; exit 1; }
          test -d android || { echo "ERREUR : dossier android introuvable"; exit 1; }
          test -d ios || { echo "ERREUR : dossier ios introuvable"; exit 1; }
          echo "Structure Flutter StudyMind vérifiée avec succès."
