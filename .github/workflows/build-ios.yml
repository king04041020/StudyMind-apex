name: Build iOS Kavelynt

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "ios/**"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: kavelynt-ios-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Compiler Kavelynt pour iOS (sans signature)
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Restaurer le cache des dépendances Flutter
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: kavelynt-pub-macos-flutter-3.38.10-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            kavelynt-pub-macos-flutter-3.38.10-

      - name: Vérifier la structure iOS
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Podfile
          test -f ios/Runner/Info.plist
          test -f ios/Runner/GoogleService-Info.plist
          test -f ios/Runner.xcodeproj/project.pbxproj
          plutil -lint ios/Runner/GoogleService-Info.plist
          python3 - <<'PY'
          import re
          from pathlib import Path
          project = Path("ios/Runner.xcodeproj/project.pbxproj").read_text()
          ids = re.findall(r"PRODUCT_BUNDLE_IDENTIFIER\s*=\s*([^;]+);", project)
          assert len(ids) == 2, f"Expected exactly 2 Runner bundle identifiers, found {len(ids)}"
          assert all(value.strip() == "com.studymind.app" for value in ids), f"Unexpected Xcode bundle identifiers: {ids}"
          assert project.count("INFOPLIST_FILE = Runner/Info.plist;") == 2, "Runner Info.plist must be set in Debug and Release"
          assert "GoogleService-Info.plist" in project, "Firebase plist missing from Xcode project"
          assert "Flutter Build" in project and "xcode_backend.sh\\" in project, "Flutter build shell phase missing"
          assert "Flutter Thin Binary" in project and "embed_and_thin" in project, "Flutter embed/thin shell phase missing"
          assert "GeneratedPluginRegistrant.m" in project, "Generated plugin registrant is not wired into Runner sources"
          assert project.count("CLANG_ENABLE_MODULES = YES;") == 2, "Clang modules must be enabled for Objective-C plugin imports"
          assert project.count("SWIFT_OBJC_BRIDGING_HEADER = Runner/Runner-Bridging-Header.h;") == 2, "Swift bridging header must be configured in Debug and Release"
          assert Path("ios/Runner/Runner-Bridging-Header.h").exists(), "Swift bridging header file is missing"
          assert "AppFrameworkInfo.plist" in project, "Flutter framework metadata plist is not wired into Runner resources"
          print("STRICT_XCODE_PROJECT_VALIDATION_OK")
          PY

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Restaurer le cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: kavelynt-pods-macos-${{ hashFiles('pubspec.yaml', 'ios/Podfile') }}
          restore-keys: |
            kavelynt-pods-macos-

      - name: Restaurer les fichiers intermédiaires Xcode
        uses: actions/cache@v4
        with:
          path: build/ios
          key: kavelynt-xcode-macos-xcode15-${{ hashFiles('pubspec.yaml', 'ios/Podfile', 'ios/Runner.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            kavelynt-xcode-macos-xcode15-${{ hashFiles('pubspec.yaml', 'ios/Podfile', 'ios/Runner.xcodeproj/project.pbxproj') }}-

      - name: Installer les dépendances CocoaPods avec reprise
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          for attempt in 1 2 3; do
            echo "CocoaPods installation attempt $attempt/3"
            if pod install; then
              test -f Pods/Manifest.lock
              test -f Runner.xcworkspace/contents.xcworkspacedata
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "CocoaPods installation failed after 3 attempts"
          exit 1

      - name: Compiler l'application iOS pour simulateur (sans signature)
        run: flutter build ios --simulator --debug

      - name: Vérifier l'application compilée
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          test -d "$APP"
          test -f "$APP/GoogleService-Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.studymind.app"
          plutil -lint "$APP/GoogleService-Info.plist"
          echo "KAVELynt_IOS_SIMULATOR_COMPILE_OK bundle=$BUNDLE_ID"

      - name: Publier l'application iOS simulateur
        uses: actions/upload-artifact@v4
        with:
          name: kavelynt-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7
