name: Build APK Kavelynt Apex
# Release pipeline expects the Kavelynt-Apex-APK artifact.
# Build and validate the APK before the release publisher uploads it.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Verifier les fichiers
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android

      - name: Installer les dependances
        run: flutter pub get

      - name: Regenerer une icone Android PNG saine
        run: |
          python -m pip install --user pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import math
          path = Path("android/app/src/main/res/drawable-nodpi/kavelynt_icon.png")
          size = 512
          image = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          px = image.load()
          for y in range(size):
              for x in range(size):
                  dx, dy = x-size/2, y-size/2
                  if dx*dx+dy*dy <= 246*246:
                      t = (x+y)/(2*size)
                      px[x,y] = (int(65+110*t), int(0+18*t), int(170+80*t), 255)
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((42,42,470,470), radius=105, outline=(255,205,75,255), width=9)
          # Stylized luminous K / neural spark mark, drawn entirely from vector-like shapes.
          draw.line([(155,145),(155,365)], fill=(255,255,255,255), width=34)
          draw.line([(165,260),(330,145)], fill=(255,255,255,255), width=34)
          draw.line([(165,260),(340,370)], fill=(255,255,255,255), width=34)
          draw.ellipse((300,90,355,145), fill=(255,205,75,255))
          draw.ellipse((350,185,395,230), fill=(255,255,255,255))
          draw.ellipse((315,350,365,400), fill=(255,205,75,255))
          path.parent.mkdir(parents=True, exist_ok=True)
          image.save(path, format="PNG", optimize=False)
          with Image.open(path) as check:
              check.verify()
          print(f"PNG neuf généré et vérifié: {path} ({size}x{size})")
          PY

      - name: Construire APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verifier integrite, alignement, signature et manifeste APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          # Align first, then sign. Never modify the APK after signing.
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" "$APK.aligned"
          mv "$APK.aligned" "$APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          # V1 is optional for modern Android; V2 and V3 are required here.
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apk-signature.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apk-signature.txt
          APP_ID="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")"
          MIN_SDK="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk "$APK")"
          TARGET_SDK="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk "$APK")"
          test "$APP_ID" = "com.studymind.app"
          test "$MIN_SDK" -le 33
          test "$TARGET_SDK" -ge "$MIN_SDK"
          echo "PACKAGE=$APP_ID MIN_SDK=$MIN_SDK TARGET_SDK=$TARGET_SDK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/'
          ls -lh "$APK"

      - name: Tester installation réelle sur émulateur Android 13
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell pm path com.studymind.app
            adb shell monkey -p com.studymind.app 1
            echo "ANDROID_INSTALL_AND_LAUNCH_OK"
      - name: Publier le fichier APK
        uses: actions/upload-artifact@v5
        with:
          name: Kavelynt-Apex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
