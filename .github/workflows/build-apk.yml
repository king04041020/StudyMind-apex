
name: Build APK StudyMind Apex

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verifier les fichiers
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android

      - name: Installer les dependances
        run: flutter pub get

      - name: Construire APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMind-Apex-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
