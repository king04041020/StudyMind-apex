
name: Build StudyMind Apex APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyMind_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Extract source
        run: |
          mkdir -p source
          unzip -q StudyMind_Source.zip -d source
          test -f source/studymind_flutter/pubspec.yaml
          test -f source/studymind_flutter/lib/main.dart
      - name: Generate Android platform
        working-directory: source/studymind_flutter
        run: flutter create --platforms=android --project-name=studymind .
      - name: Set Android application ID
        working-directory: source/studymind_flutter
        run: |
          sed -i 's/applicationId = "com.example.studymind"/applicationId = "com.studymind.app"/' android/app/build.gradle.kts || true
          sed -i "s/applicationId 'com.example.studymind'/applicationId 'com.studymind.app'/" android/app/build.gradle || true
      - name: Dependencies
        working-directory: source/studymind_flutter
        run: flutter pub get
      - name: Build release APK
        working-directory: source/studymind_flutter
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: StudyMind-Apex-APK
          path: source/studymind_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
