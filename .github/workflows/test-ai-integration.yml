name: Test Kavelynt AI end-to-end

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - ".github/workflows/test-ai-integration.yml"
permissions:
  contents: read

jobs:
  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create temporary Firebase email/password test account
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)"
          EMAIL="kavelynt-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASSWORD="$(openssl rand -hex 24)"
          BODY="$(jq -n --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password,returnSecureToken:true}')"
          HTTP_CODE="$(curl --silent --show-error -o /tmp/firebase-auth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$BODY" \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}")"
          RESPONSE="$(cat /tmp/firebase-auth.json)"
          TOKEN="$(jq -r '.idToken // empty' <<< "$RESPONSE")"
          if [ -z "$TOKEN" ]; then
            echo "Firebase email/password test account creation failed (HTTP $HTTP_CODE)."
            jq '{error: .error.message}' <<< "$RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "id_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Test AI chat response
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n --arg message 'Réponds exactement : KAVELYNT_CHAT_OK' '{message:$message,mode:"KING",style:"Professeur",course:"Test",context:"Test de disponibilité."}')"
          HTTP_CODE="$(curl --silent --show-error --max-time 90 -o /tmp/worker-chat.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/chat')"
          RESPONSE="$(cat /tmp/worker-chat.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker chat returned HTTP $HTTP_CODE:"
            jq . <<< "$RESPONSE"
            exit 1
          fi
          ANSWER="$(jq -r '.answer // empty' <<< "$RESPONSE")"
          test -n "$ANSWER"
          echo "CHAT_OK: Gemini returned a non-empty answer (model: $(jq -r '.model // "unknown"' <<< "$RESPONSE"))."

      - name: Test revision sheet generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"revision",course:"Test de sciences",difficulty:"Moyen",text:"La photosynthèse est le processus par lequel les plantes vertes utilisent la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. La chlorophylle capte l’énergie lumineuse."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "REVISION_OK: non-empty study sheet generated (model: $(jq -r '.model // "unknown"' <<< "$RESPONSE"))."

      - name: Test new exercise generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"exercise",course:"Test de sciences",difficulty:"Facile",text:"La photosynthèse est le processus par lequel les plantes vertes utilisent la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. La chlorophylle capte l’énergie lumineuse."}')"
          HTTP_CODE="$(curl --silent --show-error --max-time 100 -o /tmp/worker-exercise.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          RESPONSE="$(cat /tmp/worker-exercise.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Exercise generation returned HTTP $HTTP_CODE:"
            jq . <<< "$RESPONSE"
            exit 1
          fi
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "EXERCISE_OK: non-empty exercise generated (model: $(jq -r '.model // "unknown"' <<< "$RESPONSE"))."

      - name: Test exercise correction
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"correction",course:"Test de sciences",difficulty:"Facile",text:"La photosynthèse utilise la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène.",answer:"La plante utilise la lumière, l’eau et le dioxyde de carbone pour fabriquer du sucre et libérer de l’oxygène."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "CORRECTION_OK: non-empty correction generated (model: $(jq -r '.model // "unknown"' <<< "$RESPONSE"))."
 
      - name: Test printable exercise worksheet generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"worksheet",course:"Test de sciences",difficulty:"Progressif",text:"La photosynthèse utilise la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. La chlorophylle capte l’énergie lumineuse."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 100 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 100
          echo "WORKSHEET_OK: printable exercise list generated."

      - name: Test photographed course extraction
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          # Tiny valid JPEG fixture; this checks authenticated multimodal route handling.
          IMAGE=' '
          IMAGE="$(printf '%s' "$IMAGE" | tr -d ' ')"
          BODY="$(jq -n --arg image "$IMAGE" '{task:"extract_course",course:"Cours photographié",imageBase64:$image,mimeType:"image/jpeg"}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 100 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test -n "$CONTENT"
          echo "PHOTO_EXTRACTION_OK: image route returned extracted content."

      - name: Test AI quest generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"quests",course:"Toutes les matières",difficulty:"Moyen",text:"MATIÈRE: Sciences. La photosynthèse utilise la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. MATIÈRE: Français. Le nom désigne une personne, un animal, une chose ou une idée."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 100 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          jq -e '.quests | length >= 2' <<< "$CONTENT" >/dev/null
          echo "QUESTS_OK: structured quest list generated."

      - name: Delete temporary Firebase test account
        if: always() && steps.auth.outputs.id_token != ''
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          API_KEY="$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)"
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg token "$FIREBASE_ID_TOKEN" '{idToken:$token}')" \
            "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${API_KEY}" >/dev/null
          echo "Temporary Firebase test account deleted."
