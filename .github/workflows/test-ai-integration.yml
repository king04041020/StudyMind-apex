name: Test StudyMind AI end-to-end

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-ai-integration.yml"
  workflow_run:
    workflows:
      - Deploy StudyMind AI Worker
    types:
      - completed

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create temporary Firebase email/password test account
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)"
          EMAIL="studymind-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASSWORD="$(openssl rand -hex 24)"
          BODY="$(jq -n --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password,returnSecureToken:true}')"
          HTTP_CODE="$(curl --silent --show-error -o /tmp/firebase-auth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$BODY" \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}")"
          RESPONSE="$(cat /tmp/firebase-auth.json)"
          TOKEN="$(jq -r '.idToken // empty' <<< "$RESPONSE")"
          if [ -z "$TOKEN" ]; then
            echo "Firebase email/password test account creation failed (HTTP $HTTP_CODE)."
            jq '{error: .error.message}' <<< "$RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "id_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Test AI chat response
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n --arg message 'Réponds exactement : STUDYMIND_CHAT_OK' '{message:$message,mode:"KING",style:"Professeur",course:"Test",context:"Test de disponibilité."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/chat')"
          ANSWER="$(jq -r '.answer // empty' <<< "$RESPONSE")"
          test -n "$ANSWER"
          echo "CHAT_OK: Gemini returned a non-empty answer."

      - name: Test revision sheet generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"revision",course:"Test de sciences",difficulty:"Moyen",text:"La photosynthèse est le processus par lequel les plantes vertes utilisent la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. La chlorophylle capte l’énergie lumineuse."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "REVISION_OK: non-empty study sheet generated."

      - name: Test new exercise generation
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"exercise",course:"Test de sciences",difficulty:"Facile",text:"La photosynthèse est le processus par lequel les plantes vertes utilisent la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène. La chlorophylle capte l’énergie lumineuse."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "EXERCISE_OK: non-empty exercise generated."

      - name: Test exercise correction
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          BODY="$(jq -n '{task:"correction",course:"Test de sciences",difficulty:"Facile",text:"La photosynthèse utilise la lumière, l’eau et le dioxyde de carbone pour produire des sucres et libérer de l’oxygène.",answer:"La plante utilise la lumière, l’eau et le dioxyde de carbone pour fabriquer du sucre et libérer de l’oxygène."}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $FIREBASE_ID_TOKEN" \
            -d "$BODY" 'https://studymind-assistant-2026.kayumbagradel05.workers.dev/api/generate')"
          CONTENT="$(jq -r '.content // empty' <<< "$RESPONSE")"
          test "${#CONTENT}" -gt 80
          echo "CORRECTION_OK: non-empty correction generated."
 
      - name: Delete temporary Firebase test account
        if: always() && steps.auth.outputs.id_token != ''
        env:
          FIREBASE_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          API_KEY="$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)"
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg token "$FIREBASE_ID_TOKEN" '{idToken:$token}')" \
            "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${API_KEY}" >/dev/null
          echo "Temporary Firebase test account deleted."
