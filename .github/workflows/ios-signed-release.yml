name: Signed iOS Release - Kavelynt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ipa:
    name: Archive and sign Kavelynt for iPhone
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Apple signing credentials and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          project = Path("ios/Runner.xcodeproj/project.pbxproj").read_text()
          ids = re.findall(r"PRODUCT_BUNDLE_IDENTIFIER\\s*=\\s*([^;]+);", project)
          assert len(ids) == 2, f"Expected exactly 2 Runner bundle identifiers, found {len(ids)}"
          assert all(value.strip() == "com.studymind.app" for value in ids), f"Unexpected Xcode bundle identifiers: {ids}"
          assert project.count("INFOPLIST_FILE = Runner/Info.plist;") == 2, "Runner Info.plist must be set in Debug and Release"
          assert "GoogleService-Info.plist" in project, "Firebase plist missing from Xcode project"
          print("STRICT_XCODE_PROJECT_VALIDATION_OK")
          PY
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Install Flutter and dependencies
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install --repo-update
          test -f Pods/Manifest.lock
          test -f Runner.xcworkspace/contents.xcworkspacedata

      - name: Install Apple Distribution certificate and provisioning profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/kavelynt-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/kavelynt.mobileprovision"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          test "$PROFILE_TEAM" = "$IOS_TEAM_ID"
          case "$PROFILE_APP_ID" in
            "$IOS_TEAM_ID.com.studymind.app") ;;
            *) echo "::error::Provisioning profile does not match $IOS_TEAM_ID.com.studymind.app"; exit 1 ;;
          esac
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "Signing assets installed and provisioning profile validated."

      - name: Archive signed iOS application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kavelynt.xcarchive" archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$IOS_TEAM_ID" PROVISIONING_PROFILE="$PROFILE_UUID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" PRODUCT_BUNDLE_IDENTIFIER=com.studymind.app
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {"com.studymind.app": os.environ["PROFILE_UUID"]},
              "stripSwiftSymbols": True,
              "compileBitcode": False
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kavelynt.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$RUNNER_TEMP/export/Runner.ipa"
          test -f "$IPA"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP="$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.studymind.app"
          echo "SIGNED_KAVELyNT_IPA_VERIFIED bundle=$BUNDLE_ID"

      - name: Upload signed iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: kavelynt-signed-ipa
          path: ${{ runner.temp }}/export/Runner.ipa
          if-no-files-found: error
          retention-days: 14
