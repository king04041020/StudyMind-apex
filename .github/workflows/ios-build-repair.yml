name: Repair and build Kavelynt iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-build-repair.yml"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"

permissions:
  contents: write

jobs:
  build-ios:
    name: Regenerate Flutter iOS project and compile
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Inspect Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter --version

      - name: Regenerate complete iOS platform project
        shell: bash
        run: |
          set -euo pipefail
          cp ios/Runner/GoogleService-Info.plist "$RUNNER_TEMP/GoogleService-Info.plist"
          flutter create --platforms=ios --org com.studymind --project-name kavelynt --overwrite .
          mkdir -p ios/Runner
          cp "$RUNNER_TEMP/GoogleService-Info.plist" ios/Runner/GoogleService-Info.plist
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          source = project.read_text()
          source = source.replace("com.studymind.kavelynt", "com.studymind.app")

          file_ref = 'A10000000000000000000002 /* GoogleService-Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = "GoogleService-Info.plist"; sourceTree = "<group>"; };'
          build_ref = 'A10000000000000000000001 /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000002 /* GoogleService-Info.plist */; };'
          info_ref = '97C147021CF9000F007C117D /* Info.plist */ ='
          if source.count(info_ref) != 1:
              raise SystemExit("Xcode template marker for Info.plist was not unique")
          source = source.replace(info_ref, file_ref + "\n\t\t" + info_ref, 1)

          runner_child = '97C147021CF9000F007C117D /* Info.plist */,'
          if source.count(runner_child) != 1:
              raise SystemExit("Xcode Runner group marker was not unique")
          source = source.replace(runner_child, runner_child + '\n\t\t\t\tA10000000000000000000002 /* GoogleService-Info.plist */,', 1)

          resources = '97C146EC1CF9000F007C117D /* Resources */ = {'
          if source.count(resources) != 1:
              raise SystemExit("Xcode Resources phase marker was not unique")
          start = source.index(resources)
          files_marker = 'files = ('
          pos = source.index(files_marker, start) + len(files_marker)
          source = source[:pos] + '\n\t\t\t\tA10000000000000000000001 /* GoogleService-Info.plist in Resources */,' + source[pos:]

          build_section = '/* Begin PBXBuildFile section */'
          if source.count(build_section) != 1:
              raise SystemExit("Xcode PBXBuildFile section missing")
          source = source.replace(build_section, build_section + '\n\t\t' + build_ref, 1)
          project.write_text(source)

          info = Path("ios/Runner/Info.plist")
          with info.open("rb") as stream:
              plist = plistlib.load(stream)
          plist["CFBundleDisplayName"] = "Kavelynt"
          with info.open("wb") as stream:
              plistlib.dump(plist, stream)

          with Path("ios/Runner/GoogleService-Info.plist").open("rb") as stream:
              firebase = plistlib.load(stream)
          assert firebase.get("BUNDLE_ID") == "com.studymind.app", "Firebase bundle ID mismatch"
          assert firebase.get("PROJECT_ID") == "studymind-4f791", "Unexpected Firebase project"
          assert "PRODUCT_BUNDLE_IDENTIFIER = com.studymind.app;" in project.read_text()
          print("IOS_SCAFFOLD_REGENERATED_AND_FIREBASE_CONFIGURED")
          PY
          plutil -lint ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Info.plist

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          for attempt in 1 2 3; do
            if pod install --repo-update; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Compile iOS release without signing
        run: flutter build ios --release --no-codesign -v

      - name: Verify compiled iOS application
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/GoogleService-Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.studymind.app"
          plutil -lint "$APP/GoogleService-Info.plist"
          echo "KAVELynt_IOS_COMPILE_OK bundle=$BUNDLE_ID"

      - name: Save regenerated iOS project to main
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No iOS scaffold changes to commit"
            exit 0
          fi
          git commit -m "Repair and regenerate Flutter iOS project"
          git push origin HEAD:main

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: kavelynt-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
