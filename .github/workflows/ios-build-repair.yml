name: Repair and build Kavelynt iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kavelynt-ios-repair
  cancel-in-progress: false

jobs:
  build-ios:
    name: Validate and compile Kavelynt iOS
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Inspect Apple build tools and project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter --version
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Podfile
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Runner/GoogleService-Info.plist
          grep -q "File.dirname(__FILE__)" ios/Podfile
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          with Path("ios/Runner/GoogleService-Info.plist").open("rb") as f:
              config = plistlib.load(f)
          assert config.get("BUNDLE_ID") == "com.studymind.app", "Firebase bundle ID mismatch"
          assert config.get("PROJECT_ID") == "studymind-4f791", "Firebase project mismatch"
          with Path("ios/Runner/Info.plist").open("rb") as f:
              info = plistlib.load(f)
          assert info.get("CFBundleDisplayName") == "Kavelynt", "Unexpected iOS display name"
          print("IOS_PROJECT_AND_FIREBASE_CONFIG_OK")
          PY
          plutil -lint ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Info.plist

      - name: Resolve Flutter packages and generate iOS settings
        run: flutter pub get

      - name: Verify generated Flutter settings
        shell: bash
        run: |
          set -euo pipefail
          test -s ios/Flutter/Generated.xcconfig
          grep -q '^FLUTTER_ROOT=' ios/Flutter/Generated.xcconfig
          python3 - <<'PY'
          import re
          from pathlib import Path
          project = Path("ios/Runner.xcodeproj/project.pbxproj").read_text()
          ids = re.findall(r"PRODUCT_BUNDLE_IDENTIFIER\s*=\s*([^;]+);", project)
          assert len(ids) == 2, f"Expected exactly 2 Runner bundle identifiers, found {len(ids)}"
          assert all(value.strip() == "com.studymind.app" for value in ids), f"Unexpected Xcode bundle identifiers: {ids}"
          assert project.count("INFOPLIST_FILE = Runner/Info.plist;") == 2, "Runner Info.plist must be set in Debug and Release"
          assert "GoogleService-Info.plist" in project, "Firebase plist missing from Xcode project"
          print("STRICT_XCODE_PROJECT_VALIDATION_OK")
          PY

      - name: Install CocoaPods dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          for attempt in 1 2 3; do
            echo "CocoaPods installation attempt $attempt/3"
            if pod install --repo-update; then
              test -f Pods/Manifest.lock
              test -f Runner.xcworkspace/contents.xcworkspacedata
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "CocoaPods installation failed after 3 attempts"
          exit 1

      - name: Compile iOS release without signing
        run: flutter build ios --simulator --debug -v

      - name: Verify compiled iOS application
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          test -d "$APP"
          test -f "$APP/GoogleService-Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.studymind.app"
          plutil -lint "$APP/GoogleService-Info.plist"
          echo "KAVELynt_IOS_SIMULATOR_COMPILE_OK bundle=$BUNDLE_ID"

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: kavelynt-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7
